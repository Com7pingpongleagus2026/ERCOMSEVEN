<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐺 Werewolf Cards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--card:#141829;--line:#252a3f;--txt:#e8eaf0;--dim:#7a8199;--cyan:#38f3f2;--gold:#f5c842;--red:#f04e4e;--green:#2ecc71;--radius:16px}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.container{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px}
h1{font-size:1.5rem;text-align:center;margin-bottom:6px}
h2{font-size:1.1rem;margin-bottom:12px}
.sub{color:var(--dim);text-align:center;font-size:.85rem;margin-bottom:20px}
input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-size:1rem;margin-bottom:10px;outline:none}
input:focus{border-color:var(--cyan)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:8px;transition:.2s}
.btn-primary{background:linear-gradient(135deg,var(--cyan),#1a8aff);color:#000}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f5a623);color:#000}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn:active{transform:scale(.97)}
.pill{display:inline-block;background:rgba(56,243,242,.12);color:var(--cyan);padding:4px 12px;border-radius:20px;font-size:.8rem;margin:3px}
.player-list{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.room-code{font-size:2.5rem;font-weight:900;letter-spacing:8px;text-align:center;color:var(--gold);margin:16px 0}
.role-card{text-align:center;padding:32px 20px;position:relative;overflow:hidden}
.role-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(56,243,242,.08),transparent 70%);pointer-events:none}
.role-emoji{font-size:4rem;margin-bottom:12px}
.role-name{font-size:1.8rem;font-weight:900;margin-bottom:4px}
.role-th{font-size:1.1rem;color:var(--cyan);margin-bottom:16px}
.role-desc{color:var(--dim);font-size:.9rem;line-height:1.6;text-align:left}
.role-desc b{color:var(--txt)}
.team-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:700;margin-bottom:12px}
.team-werewolf{background:rgba(240,78,78,.15);color:var(--red)}
.team-village{background:rgba(46,204,113,.15);color:var(--green)}
.team-neutral{background:rgba(245,200,66,.15);color:var(--gold)}
.role-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.role-row:last-child{border:none}
.counter{display:flex;align-items:center;gap:10px}
.counter button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:1.1rem;cursor:pointer}
.counter span{width:24px;text-align:center;font-weight:700}
.tally{text-align:center;margin-top:12px;font-size:.85rem;color:var(--dim)}
.tally b{color:var(--gold)}
.reveal-btn{width:100%;padding:18px;border:none;border-radius:var(--radius);font-size:1.1rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#1a1f35,#252a45);color:var(--dim);margin-top:16px;transition:.3s}
.reveal-btn:active{background:linear-gradient(135deg,var(--cyan),#1a8aff);color:#000}
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const ROLES=[
{en:'Werewolf',th:'มนุษย์หมาป่า',emoji:'🐺',team:'werewolf',desc:'ตื่นขึ้นตอนกลางคืนพร้อมกับหมาป่าตัวอื่น เลือกเหยื่อ 1 คนร่วมกัน<br><b>เป้าหมาย:</b> กำจัดฝ่ายมนุษย์ให้เหลือน้อยกว่าหรือเท่ากับหมาป่า'},
{en:'Alpha Wolf',th:'หมาป่าอัลฟ่า',emoji:'🐺',team:'werewolf',desc:'หมาป่าหัวหน้าฝูง ถ้าเทพพยากรณ์ส่องจะเห็นเป็น "ชาวบ้าน"<br><b>เป้าหมาย:</b> เหมือนหมาป่า แต่ซ่อนตัวได้ดีกว่า'},
{en:'Wolf Cub',th:'ลูกหมาป่า',emoji:'🐺',team:'werewolf',desc:'ถ้าลูกหมาป่าตาย คืนถัดไปหมาป่าจะฆ่าได้ 2 คน!<br><b>เป้าหมาย:</b> เหมือนหมาป่า'},
{en:'Sorcerer',th:'หมอผี (ฝ่ายหมาป่า)',emoji:'🧙',team:'werewolf',desc:'ตื่นขึ้นตอนกลางคืน ชี้คน 1 คนเพื่อดูว่าเป็น "เทพพยากรณ์" หรือไม่<br><b>เป้าหมาย:</b> ช่วยหมาป่าหาเทพพยากรณ์'},
{en:'Seer',th:'เทพพยากรณ์',emoji:'🔮',team:'village',desc:'ตื่นขึ้นทุกคืน เลือกดูบทบาทของผู้เล่น 1 คน (GM จะบอกว่าเป็นฝ่ายใด)<br><b>เป้าหมาย:</b> หาหมาป่าแล้วชี้นำหมู่บ้าน'},
{en:'Mystic Seer',th:'เทพพยากรณ์ลึกลับ',emoji:'🌀',team:'village',desc:'เหมือนเทพพยากรณ์ แต่เห็น "บทบาทจริง" (ไม่ใช่แค่ฝ่าย)<br><b>เป้าหมาย:</b> รู้ลึกกว่า'},
{en:'Bodyguard',th:'บอดี้การ์ด',emoji:'🛡️',team:'village',desc:'เลือกปกป้องผู้เล่น 1 คนทุกคืน (คนนั้นจะไม่ตายจากหมาป่า) ห้ามเลือกคนเดิมซ้อนสองคืนติด<br><b>เป้าหมาย:</b> ปกป้องคนสำคัญ'},
{en:'Witch',th:'แม่มด',emoji:'🧪',team:'village',desc:'มียา 2 ขวด: 💊 ยาชุบชีวิต + ☠️ ยาพิษ ใช้ได้ขวดละ 1 ครั้งตลอดเกม<br><b>เป้าหมาย:</b> ใช้ยาให้คุ้มค่า'},
{en:'Hunter',th:'นายพราน',emoji:'🏹',team:'village',desc:'เมื่อตาย สามารถเลือกยิงผู้เล่นอีก 1 คนให้ตายทันที<br><b>เป้าหมาย:</b> ยิงหมาป่าตอนตาย'},
{en:'Cupid',th:'กามเทพ',emoji:'💕',team:'village',desc:'คืนแรก: เลือกผู้เล่น 2 คนเป็นคู่รัก — ถ้าคนหนึ่งตาย อีกคนตายตาม<br><b>เป้าหมาย:</b> ระวังอย่าจับคู่หมาป่ากับมนุษย์!'},
{en:'Prince',th:'เจ้าชาย',emoji:'👑',team:'village',desc:'ไม่สามารถถูกเผากลางวันได้! ถ้าถูกโหวตเผา จะเฉลยตัวว่าเป็นเจ้าชาย<br><b>เป้าหมาย:</b> เป็น shield ตอนกลางวัน'},
{en:'Tough Guy',th:'นักสู้',emoji:'💪',team:'village',desc:'ถ้าถูกหมาป่ากัด จะยังไม่ตายทันที — มีชีวิตอีก 1 วัน<br><b>เป้าหมาย:</b> ใช้เวลาที่เหลือบอกข้อมูล'},
{en:'Mentalist',th:'นักอ่านใจ',emoji:'🧠',team:'village',desc:'ทุกคืน GM บอกว่าผู้เล่น 2 คนอยู่ "ฝ่ายเดียวกัน" หรือ "ต่างฝ่าย"<br><b>เป้าหมาย:</b> ปะติดปะต่อข้อมูล'},
{en:'Tanner',th:'ยาจก',emoji:'🃏',team:'neutral',desc:'<b>ชนะทันทีถ้าถูกเผากลางวัน!</b> ต้องทำให้คนอื่นโหวตเผาตัวเอง<br><b>เป้าหมาย:</b> ถูกเผา = ชนะ'},
{en:'Villager',th:'ชาวบ้าน',emoji:'🧑‍🌾',team:'village',desc:'ไม่มีความสามารถพิเศษ แต่มีพลังโหวต! ใช้เหตุผลหาหมาป่า<br><b>เป้าหมาย:</b> โหวตเผาหมาป่าให้หมด'}
];
const TEAM_LABEL={werewolf:'🐺 ฝ่ายหมาป่า',village:'🏡 ฝ่ายมนุษย์',neutral:'🃏 ฝ่ายอิสระ'};
let state={view:'home',code:null,name:null,isHost:false,ws:null};
function $(id){return document.getElementById(id)}
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function connectWS(){
  const proto=location.protocol==='https:'?'wss':'ws';
  const url=proto+'://'+location.host+'?code='+state.code+'&name='+encodeURIComponent(state.name);
  const ws=new WebSocket(url);
  ws.onmessage=(e)=>{
    const msg=JSON.parse(e.data);
    if(msg.type==='playerJoined')renderHostLobby(msg.players);
    if(msg.type==='cardDealt')showCard(msg.role);
    if(msg.type==='dealt'&&state.isHost)renderHostDealt();
    if(msg.type==='reset'){state.view='lobby';render();}
  };
  ws.onclose=()=>{setTimeout(connectWS,2000);};
  state.ws=ws;
}

function render(){
  if(state.view==='home')return renderHome();
  if(state.view==='host-setup')return renderHostSetup();
  if(state.view==='host-lobby')return fetchAndRenderHostLobby();
  if(state.view==='player-lobby')return renderPlayerLobby();
}

function renderHome(){
  $('app').innerHTML='<div class="card" style="text-align:center">'+
    '<h1>🐺 Werewolf Cards</h1>'+
    '<p class="sub">แจกการ์ดบทบาทลับ — ดูได้แค่ในมือตัวเอง</p>'+
    '<button class="btn btn-primary" onclick="goCreate()">👑 สร้างห้อง (GM)</button>'+
    '<button class="btn btn-ghost" onclick="goJoin()">📱 เข้าร่วมห้อง</button></div>';
}

function goCreate(){
  $('app').innerHTML='<div class="card"><h2>👑 สร้างห้อง</h2>'+
    '<input id="hostName" placeholder="ชื่อของคุณ (ผู้ดำเนินเกม)" autocomplete="off">'+
    '<input id="roomSecret" placeholder="ตั้งรหัสผ่านห้อง" type="text" autocomplete="off">'+
    '<button class="btn btn-primary" onclick="createRoom()">สร้างห้อง</button>'+
    '<button class="btn btn-ghost" onclick="state.view=\'home\';render()">← กลับ</button></div>';
}

async function createRoom(){
  const hostName=$('hostName').value.trim();
  const sec=$('roomSecret').value.trim();
  if(!hostName||!sec)return alert('กรอกข้อมูลให้ครบ');
  const res=await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostName:hostName,password:sec})});
  const data=await res.json();
  if(data.error)return alert(data.error);
  state.code=data.code;state.name=hostName;state.isHost=true;state.view='host-setup';
  connectWS();render();
}

function goJoin(){
  $('app').innerHTML='<div class="card"><h2>📱 เข้าร่วมห้อง</h2>'+
    '<input id="joinCode" placeholder="รหัสห้อง (4 หลัก)" maxlength="4" inputmode="numeric">'+
    '<input id="joinSecret" placeholder="รหัสผ่าน" type="text">'+
    '<input id="joinName" placeholder="ชื่อของคุณ" autocomplete="off">'+
    '<button class="btn btn-primary" onclick="joinRoom()">เข้าร่วม</button>'+
    '<button class="btn btn-ghost" onclick="state.view=\'home\';render()">← กลับ</button></div>';
}

async function joinRoom(){
  const code=$('joinCode').value.trim();
  const sec=$('joinSecret').value.trim();
  const playerName=$('joinName').value.trim();
  if(!code||!sec||!playerName)return alert('กรอกข้อมูลให้ครบ');
  const res=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,playerName:playerName,password:sec})});
  const data=await res.json();
  if(data.error)return alert(data.error);
  state.code=code;state.name=playerName;state.isHost=false;state.view='player-lobby';
  connectWS();render();
}

let rolePicks={};
function renderHostSetup(){
  $('app').innerHTML='<div class="card"><h2>👑 ห้องของคุณ</h2>'+
    '<div class="room-code">'+state.code+'</div>'+
    '<p class="sub">บอกรหัสนี้ + รหัสผ่าน ให้ผู้เล่นเข้าร่วม</p>'+
    '<div id="playerList" class="player-list"></div>'+
    '<p class="tally" id="playerCount"></p></div>'+
    '<div class="card"><h2>🎭 เลือกบทบาท</h2>'+
    '<div id="roleRows">'+ROLES.map(r=>'<div class="role-row"><span>'+r.emoji+' '+r.th+'</span>'+
      '<div class="counter"><button onclick="adjRole(\''+r.en+'\',-1)">−</button>'+
      '<span id="rc-'+r.en.replace(/\s/g,'_')+'">'+(rolePicks[r.en]||0)+'</span>'+
      '<button onclick="adjRole(\''+r.en+'\',1)">+</button></div></div>').join('')+
    '</div><p class="tally" id="tally"></p>'+
    '<button class="btn btn-gold" onclick="dealCards()">🎴 สุ่มแจกการ์ด!</button></div>';
  fetchPlayers();updateTally();
}

function adjRole(en,d){
  rolePicks[en]=Math.max(0,(rolePicks[en]||0)+d);
  const el=$('rc-'+en.replace(/\s/g,'_'));if(el)el.textContent=rolePicks[en];
  updateTally();
}
function updateTally(){
  let total=0;for(const k in rolePicks)total+=rolePicks[k];
  const el=$('tally');if(el)el.innerHTML='การ์ดทั้งหมด: <b>'+total+'</b> ใบ';
}
async function fetchPlayers(){
  const res=await fetch('/api/room/'+state.code);
  const data=await res.json();
  renderHostLobby(data.players);
}
function renderHostLobby(players){
  const el=$('playerList');if(!el)return;
  el.innerHTML=players.map(n=>'<span class="pill">'+esc(n)+'</span>').join('');
  const pc=$('playerCount');if(pc)pc.innerHTML='ผู้เล่น: <b>'+players.length+'</b> คน';
}

async function dealCards(){
  const roles=[];
  for(const k in rolePicks){if(rolePicks[k]>0)roles.push({name:k,count:rolePicks[k]});}
  await fetch('/api/roles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:state.code,roles:roles})});
  const res=await fetch('/api/deal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:state.code})});
  const data=await res.json();
  if(data.error)return alert(data.error);
}
function renderHostDealt(){
  $('app').innerHTML='<div class="card" style="text-align:center"><h2>✅ แจกการ์ดแล้ว!</h2>'+
    '<p class="sub">ผู้เล่นทุกคนเห็นการ์ดในมือของตัวเองแล้ว</p>'+
    '<p style="font-size:3rem;margin:20px 0">🃏</p>'+
    '<button class="btn btn-ghost" onclick="resetRoom()">🔄 สุ่มใหม่ (เกมต่อไป)</button></div>';
}
async function resetRoom(){
  await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:state.code})});
  state.view='host-setup';render();
}

function renderPlayerLobby(){
  $('app').innerHTML='<div class="card" style="text-align:center"><h2>📱 เข้าห้องแล้ว!</h2>'+
    '<div class="room-code">'+state.code+'</div>'+
    '<p class="sub">รอ GM แจกการ์ด...</p>'+
    '<p style="font-size:3rem;margin:20px 0">⏳</p>'+
    '<p style="color:var(--dim)">ชื่อ: <b>'+esc(state.name)+'</b></p></div>';
}

function showCard(roleName){
  const role=ROLES.find(r=>r.en===roleName)||{en:roleName,th:roleName,emoji:'❓',team:'village',desc:'บทบาทกำหนดเอง'};
  state.view='card';
  $('app').innerHTML=
    '<div class="card role-card" id="cardFace" style="display:none">'+
      '<span class="team-badge team-'+role.team+'">'+(TEAM_LABEL[role.team]||role.team)+'</span>'+
      '<div class="role-emoji">'+role.emoji+'</div>'+
      '<div class="role-name">'+esc(role.en)+'</div>'+
      '<div class="role-th">'+esc(role.th)+'</div>'+
      '<div class="role-desc">'+role.desc+'</div></div>'+
    '<div class="card" style="text-align:center" id="cardBack">'+
      '<p style="font-size:4rem;margin:20px 0">🂠</p>'+
      '<p style="color:var(--dim);margin-bottom:16px">การ์ดของคุณพร้อมแล้ว</p>'+
      '<button class="reveal-btn" id="revealBtn" ontouchstart="showFace()" ontouchend="hideFace()" onmousedown="showFace()" onmouseup="hideFace()" onmouseleave="hideFace()">'+
      '👆 กดค้างเพื่อดูการ์ด</button>'+
      '<p style="color:var(--dim);font-size:.75rem;margin-top:12px">ปล่อยมือ = ซ่อนการ์ด (กันคนอื่นแอบดู)</p></div>';
}
function showFace(){$('cardFace').style.display='block';$('cardBack').style.display='none';}
function hideFace(){$('cardFace').style.display='none';$('cardBack').style.display='block';}

render();
</script>
</body>
</html>
